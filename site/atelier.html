<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Brasserie de la Fonderie</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/jeux.css">
<link rel="stylesheet" href="css/ligne.css">
<link rel="stylesheet" href="css/atelier.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/environments/RoomEnvironment.js":"./vendor/three/addons/RoomEnvironment.js"}}</script>
</head>
<body>

<main class="mission ligne atelier" id="vue-mission">
  <section class="cote-scene" aria-label="Atelier : données et programme">
    <div class="barre-scene">
      <a class="bouton sombre" id="bouton-carte" href="missions.html">Carte</a>
      <span class="mission-id" id="mission-id"></span>
      <span class="etoiles" id="mission-etoiles"></span>
      <button class="bouton sombre" id="bouton-annuler" type="button" title="Ctrl+Z" disabled>Annuler</button>
      <button class="bouton sombre" id="bouton-retablir" type="button" title="Ctrl+Y" disabled>Rétablir</button>
      <span class="espace"></span>
      <button class="bouton sombre" id="bouton-mode" type="button" title="Changer de mode d'affichage">3D</button>
      <span class="etat-python" id="etat-python" role="status">Préparation de Python…</span>
      <span class="mesure" id="mesure" role="status"></span>
    </div>
    <div class="vue" id="vue">
      <div class="barre-outils" id="barre-outils" role="toolbar" aria-orientation="vertical" aria-label="Outils et pièces"></div>
      <div class="info-bulle" id="info-bulle" role="tooltip" hidden></div>
      <div class="legende-rejeu" id="legende" role="status" aria-live="polite"></div>
    </div>
    <div class="commandes">
      <button class="bouton principal" id="bouton-lancer" type="button" title="Ctrl+Entrée">Lancer le programme</button>
      <button class="bouton sombre" id="bouton-rejouer" type="button">Rejouer</button>
      <button class="bouton sombre" id="bouton-pas" type="button" title="F10">Pas à pas</button>
      <button class="bouton sombre" id="bouton-pause" type="button" aria-pressed="false" title="P">Pause</button>
      <button class="bouton sombre" id="bouton-vitesse" type="button" aria-pressed="false">Rejeu rapide</button>
      <select class="choix-cas" id="choix-cas" aria-label="Cas de test rejoué" hidden></select>
      <span class="espace"></span>
      <button class="bouton sombre" id="bouton-son" type="button" aria-pressed="true" title="M">Son</button>
    </div>
  </section>
  <section class="cote-code">
    <header class="enonce">
      <div class="surtitre" id="mission-surtitre"></div>
      <h1 id="mission-titre"></h1>
      <p id="mission-enonce"></p>
      <ul class="objectifs" id="mission-objectifs"></ul>
    </header>
    <div class="zone-editeur">
      <div class="barre-editeur">
        <span class="nom-fichier" id="nom-fichier">programme.py</span>
        <span class="info-code" id="info-code">le hall et le code se suivent : modifiez l'un ou l'autre</span>
        <span class="espace"></span>
        <button class="bouton" id="bouton-agrandir" type="button" title="Agrandir le texte">A+</button>
      </div>
      <div id="editeur"></div>
    </div>
    <div class="zone-tests">
      <div class="onglets" role="tablist">
        <button class="onglet" role="tab" data-onglet="piece" aria-selected="false" type="button">Pièce</button>
        <button class="onglet" role="tab" data-onglet="tests" aria-selected="true" type="button">Tests</button>
        <button class="onglet" role="tab" data-onglet="sortie" aria-selected="false" type="button">Tableau de bord</button>
        <button class="onglet" role="tab" data-onglet="problemes" aria-selected="false" type="button">Problèmes</button>
        <button class="onglet" role="tab" data-onglet="indice" aria-selected="false" type="button">Indice</button>
        <span class="resume" id="resume-tests"></span>
      </div>
      <div class="panneau" id="panneau" role="tabpanel"></div>
    </div>
  </section>
</main>

<script type="module" src="js/atelier/atelier.js"></script>
</body>
</html>
